services:
  - type: web
    name: pos-billing
    env: python
    region: singapore          # choose the region closest to you
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true     # Render auto-generates a secure value
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: pos-billing.onrender.com
      - key: PYTHON_VERSION
        value: "3.12"
