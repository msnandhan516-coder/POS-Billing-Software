services:
  - type: web
    name: pos-billing
    env: python
    region: singapore
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py ensure_users && python manage.py seed_demo_data && python manage.py collectstatic --no-input

    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: pos-billing-software-b3w2.onrender.com

      - key: PYTHON_VERSION
        value: "3.12"