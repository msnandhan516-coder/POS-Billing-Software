<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Login</title>
</head>

<body>

    <h1>POS Billing</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div>
            {{ form.username.label_tag }}
            {{ form.username }}
        </div>

        <div>
            {{ form.password.label_tag }}
            {{ form.password }}
        </div>

        <button type="submit">
            Sign In
        </button>
    </form>

</body>
</html>
